name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Windows x86_64 is the only supported platform in milestone 1 (ADR-0003).
jobs:
  rust:
    name: Rust (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    name: Web app (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  contract:
    name: Contract (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the server
        run: cargo build -p microscope-server --locked
      - name: Install
        run: npm ci
        working-directory: web
      # The server must run in the same step as the tests: on Windows, the
      # runner stops a step's processes when the step ends.
      - name: Contract tests against a running server
        working-directory: web
        env:
          MICROSCOPE_API_URL: http://127.0.0.1:5090/api/v1/
        run: |
          $server = Start-Process -PassThru -FilePath ../target/debug/microscope-server.exe -WorkingDirectory .. -ArgumentList '-c', 'configs/simulation.json', '--port', '5090' -RedirectStandardOutput ../server.log -RedirectStandardError ../server.err.log
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:5090/api/v1/health | Out-Null; $ready = $true } catch { Start-Sleep -Seconds 1 }
          }
          $status = 1
          if ($ready) { npm run test:contract; $status = $LASTEXITCODE }
          Stop-Process -Id $server.Id
          if ($status -ne 0) { Get-Content ../server.log, ../server.err.log }
          exit $status

  e2e:
    name: End to end (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      # The web app first: the release build embeds web/dist (ADR-0016).
      - name: Build the web app
        run: npm run build
        working-directory: web
      - name: Build the server, with the web app embedded
        run: cargo build --release -p microscope-server --locked
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: web
      - name: End-to-end and visual tests against the served app
        run: npx playwright test
        working-directory: web
        env:
          MICROSCOPE_SERVER: target/release/microscope-server.exe
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
