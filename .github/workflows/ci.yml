name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Windows x86_64 is the only supported platform in milestone 1 (ADR-0003).
jobs:
  rust:
    name: Rust (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    name: Web app (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  contract:
    name: Contract (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the server
        run: cargo build -p microscope-server --locked
      - name: Start the server
        run: |
          Start-Process -FilePath target/debug/microscope-server.exe -ArgumentList '-c', 'configs/simulation.json', '--port', '5090' -RedirectStandardOutput server.log -RedirectStandardError server.err.log
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:5090/api/v1/health | Out-Null; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          Get-Content server.log, server.err.log
          exit 1
      - name: Install
        run: npm ci
        working-directory: web
      - name: Contract tests
        run: npm run test:contract
        working-directory: web
        env:
          MICROSCOPE_API_URL: http://127.0.0.1:5090/api/v1/
      - name: Server log
        if: failure()
        run: Get-Content server.log, server.err.log
