[package]
name = "optics-fw"
description = "The optics controller's firmware for the Pico 2 on the carrier board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
optics-core = { path = "../core" }
# Not 0.7.10: dependencies must be at least two weeks old (CLAUDE.md).
cortex-m = { version = "=0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "imagedef-secure-exe", "binary-info"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb = "0.6"
embedded-hal-nb = "1.0.0"
