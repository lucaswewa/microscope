[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The pinned toolchain (rust-toolchain.toml) is also the minimum supported
# version. It matches teta-wot's.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/microscope"
publish = false

[workspace.dependencies]
# Internal crates. The dependency rules between them are in ADR-0005.
microscope-core = { path = "crates/microscope-core" }
microscope-sim = { path = "crates/microscope-sim" }
microscope-things = { path = "crates/microscope-things" }

# teta-wot is pinned to its release tag, with no upstream changes (ADR-0004).
# Use its axum re-export (teta_wot::http::axum) rather than depending on axum.
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.1.0" }

# External crates, at the versions teta-wot uses where it uses them too.
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
gethostname = "1"
http-body-util = "0.1.5"
# Images for the simulator: PNG only for now; P17 adds JPEG.
image = { version = "0.25.10", default-features = false, features = ["png"] }
os_info = { version = "3", default-features = false }
# 8.12, not 8.13: dependencies must be at least two weeks old (CLAUDE.md).
rust-embed = "8.12"
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.41"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "registry", "fmt", "ansi", "env-filter"] }
uuid = { version = "1.18", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
