[package]
name = "microscope-sdk"
description = "The camera vendors' SDKs, pylon and Vimba X, through their C APIs, loaded at run time (ADR-0041)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libloading.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace's lints, but unsafe code is allowed: this is the one crate
# that calls C (ADR-0041). Each unsafe block says why it's sound.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
